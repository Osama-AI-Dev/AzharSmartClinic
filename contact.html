<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Get in touch with Azhar Smart Clinic.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A9%BA%3C/text%3E%3C/svg%3E">
    <title>Azhar Smart Clinic - Contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div id="container">
            <a href="index.html" class="brand">Azhar Smart Clinic</a>
            <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
            <nav class="site-nav">
                <a href="index.html">Home</a>
                <a href="Services.html">Services</a>
                <a href="team.html">Our Team</a>
                <a href="booking.html">Booking</a>
                <a href="contact.html">Contact</a>
            </nav>
        </div>
    </header>

    <main class="page-wrap">
        <div class="page-header">
            <h1>Contact Us</h1>
        </div>

        <form id="contact-form" novalidate>
            <div class="field">
                <label for="contact-name">Name</label>
                <input type="text" id="contact-name" name="Name" placeholder="Your full name" required>
            </div>

            <div class="field">
                <label for="contact-email">Email</label>
                <input type="email" id="contact-email" name="Email" placeholder="you@example.com" required>
            </div>

            <div class="field">
                <label for="contact-message">Message</label>
                <textarea id="contact-message" name="Message" placeholder="How can we help?" required></textarea>
            </div>

            <button type="submit">Send Message</button>
        </form>
    </main>

    <footer>
        &copy; 2026 Azhar Smart Clinic. All rights reserved.
    </footer>

    <script src="script.js"></script>
    <script>
        document.getElementById("contact-form").addEventListener("submit", function (e) {
            e.preventDefault();
            var form = e.target;
            var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!form.Name.value.trim()) {
                alert("Please provide your name.");
                form.Name.focus();
                return;
            }
            if (!emailPattern.test(form.Email.value.trim())) {
                alert("Please provide a valid email address.");
                form.Email.focus();
                return;
            }
            if (!form.Message.value.trim()) {
                alert("Please provide a message.");
                form.Message.focus();
                return;
            }

            window.location.href = "success2.html";
        });
    </script>
</body>
</html>
